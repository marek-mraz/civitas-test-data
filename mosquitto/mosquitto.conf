# Mosquitto configuration for CIVITAS/CORE test data source

# Security is configured per-listener (below), not globally
per_listener_settings true

# Plaintext listener — used by the internal simulator/healthcheck and by the
# external NiFi adapter (which cannot do TLS MQTT). Published to the host, but
# should be firewalled to the AKS egress IP. Same password file as TLS.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# Public TLS listener — the only port published to the internet.
# server.crt/server.key are the Let's Encrypt fullchain + key published by the
# certbot service (cert-gen's self-signed pair until the first issuance).
# Certfile must stay the full chain or embedded clients (Loxone) fail
# validation. The broker is SIGHUPed by its entrypoint when the files change.
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Authentication on the public listener: password file is generated from
# MQTT_USER / MQTT_PASSWORD by the container entrypoint (see docker-compose.yml)
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
