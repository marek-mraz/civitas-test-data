# CIVITAS/CORE test data sources — Smart Meter energy use case ("TAF10")
#
# One self-contained stack that provides everything the CIVITAS/CORE
# "Connect external Data" guide needs:
#
#   postgres   -> master data source (Things / Sensors / ObservedProperties /
#                 Datastreams, modeled on FIWARE Smart Data Models "Device")
#   mosquitto  -> MQTT broker for measurement data
#   simulator  -> reads master data from postgres and continuously publishes
#                 measurements (Smart Data Models "ACMeasurement") via MQTT
#
# Deployable as a single Docker Compose project in Dokploy.
# All credentials/ports are overridable via environment (.env).
#
# Security: both data sources require username/password auth. There are
# deliberately NO default passwords — the stack refuses to start unless
# POSTGRES_PASSWORD and MQTT_PASSWORD are set (in .env or Dokploy Environment),
# so a deployment can never go online with well-known credentials.
#
# TLS: cert-gen auto-generates a self-signed certificate into the certs volume
# on first start. Postgres clients connect with "encrypt, don't verify"
# (sslmode=require). For MQTT the certbot service replaces the self-signed cert
# with a real Let's Encrypt one (Route 53 DNS-01) as soon as PUBLIC_HOSTNAME +
# AWS credentials are set — required because Loxone Miniservers refuse
# self-signed brokers with no override. Postgres rejects plaintext remote
# connections; MQTT publishes the TLS listener (8883) plus a password-protected
# plaintext listener (1883) for the NiFi adapter — firewall 1883 to the cluster.

services:
  cert-gen:
    image: alpine/openssl:latest
    # Always re-pull: these are floating tags, so a redeploy should pick up
    # upstream patches instead of reusing whatever is cached on the host.
    pull_policy: always
    restart: "no"
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    environment:
      # hostname clients use — only matters if a client chooses to verify
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
    volumes:
      - ./certs/gen-certs.sh:/gen-certs.sh:ro
      - certs:/certs

  # Let's Encrypt cert for the public MQTT listener via Route 53 DNS-01.
  # Needs AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (scoped to the marek-mraz.com
  # hosted zone) in the environment; without them it idles and mosquitto keeps
  # the cert-gen self-signed cert.
  certbot:
    image: certbot/dns-route53:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    environment:
      DOMAIN: ${PUBLIC_HOSTNAME:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-mrazbb@gmail.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      cert-gen:
        condition: service_completed_successfully
    volumes:
      - ./certs/renew-loop.sh:/renew-loop.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certs:/certs

  postgres:
    image: postgres:16-alpine
    pull_policy: always
    restart: unless-stopped
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
      -c hba_file=/etc/postgresql/pg_hba.conf
    depends_on:
      cert-gen:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartmeter}
      POSTGRES_USER: ${POSTGRES_USER:-civitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env / Dokploy Environment}
      # SCRAM challenge-response auth: the password itself never crosses the
      # wire, and stored hashes are salted (applies to first initdb only)
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schema + Smart Data Models seed. Runs on the first start of an empty
      # volume only; anything that must reach an existing deployment belongs in
      # ./postgres/seed instead (applied every deploy by the `seed` service).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # TLS-only client auth, applied on every boot
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume:
          subpath: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:2
    pull_policy: always
    restart: unless-stopped
    environment:
      MQTT_USER: ${MQTT_USER:-civitas}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env / Dokploy Environment}
    # Generate the password file from env on every start, then run the broker.
    # The background loop SIGHUPs mosquitto when certbot publishes a renewed
    # certificate (mosquitto 2.x reloads TLS certs on SIGHUP).
    entrypoint:
      - sh
      - -c
      - |
        mosquitto_passwd -c -b /mosquitto/config/passwd "$$MQTT_USER" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/passwd
        touch /tmp/certs-loaded
        while sleep 3600; do
          if [ /mosquitto/certs/server.crt -nt /tmp/certs-loaded ]; then
            touch /tmp/certs-loaded
            kill -HUP 1
          fi
        done &
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    depends_on:
      cert-gen:
        condition: service_completed_successfully
    ports:
      # TLS listener (public) + plaintext listener for the NiFi adapter, which
      # can't do TLS MQTT. Firewall 1883 to the AKS egress IP (4.184.207.76).
      - "${MQTT_TLS_PORT:-8883}:8883"
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - type: volume
        source: certs
        target: /mosquitto/certs
        read_only: true
        volume:
          subpath: mosquitto
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u \"$${MQTT_USER}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Applies ./postgres/seed/*.sql on every deploy, so master data added after
  # the first deployment (new devices, new datastreams) actually lands in an
  # existing database — /docker-entrypoint-initdb.d would silently skip it.
  # The SQL there is idempotent, so re-running is a no-op.
  seed:
    image: postgres:16-alpine
    pull_policy: always
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-civitas}
      PGDATABASE: ${POSTGRES_DB:-smartmeter}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env / Dokploy Environment}
      PGSSLMODE: require
    volumes:
      - ./postgres/seed:/seed:ro
    entrypoint: >
      sh -c "for f in /seed/*.sql; do echo \"applying $$f\";
      psql -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done; echo 'seed complete'"

  simulator:
    build:
      context: ./simulator
      # Refresh the base image on every build rather than reusing a stale one
      pull: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      # Master data must exist before the simulator reads it — it loads the
      # device list once at startup and never re-queries.
      seed:
        condition: service_completed_successfully
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB:-smartmeter}
      PG_USER: ${POSTGRES_USER:-civitas}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env / Dokploy Environment}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-civitas}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env / Dokploy Environment}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-taf10/sensors}
      MQTT_TEMPERATURE_TOPIC: ${MQTT_TEMPERATURE_TOPIC:-loxone/sensors}
      # false = smart meters only (use when a real Loxone publishes the topic)
      SIMULATE_TEMPERATURE: ${SIMULATE_TEMPERATURE:-true}
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-15}

  # Enriches raw Loxone payloads (bare "27.300" or {"temperature": 27.4}) into
  # the full CIVITAS shape on the same topic — the platform's NiFi mapping
  # only ingests messages with refDevice + dateObserved + temperature, and a
  # Miniserver cannot generate the ISO timestamp itself. See LOXONE.md §4.
  bridge:
    build:
      context: ./bridge
      pull: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB:-smartmeter}
      PG_USER: ${POSTGRES_USER:-civitas}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env / Dokploy Environment}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-civitas}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env / Dokploy Environment}
      MQTT_TEMPERATURE_TOPIC: ${MQTT_TEMPERATURE_TOPIC:-loxone/sensors}

volumes:
  postgres-data:
  mosquitto-data:
  certs:
  letsencrypt:
